name: Spotify sync

# Spotify only keeps the last 50 plays, so save them regularly to build a full
# week of listening history for the music page.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Save recent plays
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://bradywoz.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set, skipping"
            exit 0
          fi
          status=$(curl --silent --show-error --output response.txt \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/spotify/sync")
          cat response.txt
          echo
          if [ "$status" != "200" ]; then
            # A 3xx usually means SITE_URL redirects (e.g. to www), which drops the secret
            echo "::error::Sync returned HTTP $status from $SITE_URL. If it's a redirect, set the SITE_URL repository variable to the address the site redirects to."
            exit 1
          fi
